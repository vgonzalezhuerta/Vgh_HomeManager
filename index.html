<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Infraestructura de casa</title>
<meta name="theme-color" content="#1b2230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-fuente.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-apple.png">
<style>
/* Ficha técnica: pestañas; cuadro como filas de carril DIN; plano con marcas tocables por capas de sistema */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --fg:#1b2230; --muted:#5d6676; --line:#d9dde4;
  --accent:#d98a00; --accent-soft:#fff3db; --ink-accent:#8a5600;
  --iga:#1f4fa3; --dif:#6a3fa0; --free:#9aa1ad; --warn:#b3261e; --warn-soft:#fde8e6;
  --c13:#1f6fd1; --c15:#d0362b; --c17:#8a3fd1; --c19:#1b8a4a; --c21:#d98a00; --cx:#0f7f86;
  --box:#2b3445; --unk:#c62828; --dud:#c77700; --ok:#2e7d4f;
  --s-ele:#d98a00; --s-cal:#d0362b; --s-agu:#1f6fd1; --s-san:#8a5a2b; --s-gas:#a07800;
  --s-dat:#0f7f86; --s-cli:#7a4fd1; --s-seg:#c2185b; --s-otr:#5d6676;
  --plan-filter:none;
  --display:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1b212b; --fg:#e7eaf0; --muted:#9aa3b2; --line:#2c3441;
  --accent:#f0a52a; --accent-soft:#33280f; --ink-accent:#f6c46f;
  --iga:#7ea6f0; --dif:#b79ae6; --free:#6b7383; --warn:#f2867c; --warn-soft:#3a1d1b;
  --box:#dfe4ec; --unk:#ff6b61; --dud:#f2b443; --ok:#5cc28a;
  --s-ele:#f0a52a; --s-cal:#ff7a6b; --s-agu:#6aa8ff; --s-san:#c99868; --s-gas:#e0bb3a;
  --s-dat:#3cc6cf; --s-cli:#b79ae6; --s-seg:#f06aa0; --s-otr:#9aa3b2;
  --plan-filter:invert(.88) hue-rotate(180deg); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1b212b; --fg:#e7eaf0; --muted:#9aa3b2; --line:#2c3441;
  --accent:#f0a52a; --accent-soft:#33280f; --ink-accent:#f6c46f;
  --iga:#7ea6f0; --dif:#b79ae6; --free:#6b7383; --warn:#f2867c; --warn-soft:#3a1d1b;
  --box:#dfe4ec; --unk:#ff6b61; --dud:#f2b443; --ok:#5cc28a;
  --s-ele:#f0a52a; --s-cal:#ff7a6b; --s-agu:#6aa8ff; --s-san:#c99868; --s-gas:#e0bb3a;
  --s-dat:#3cc6cf; --s-cli:#b79ae6; --s-seg:#f06aa0; --s-otr:#9aa3b2;
  --plan-filter:invert(.88) hue-rotate(180deg); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.4}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding-block:max(14px,env(safe-area-inset-top,0px)) 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:10px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub .err{color:var(--warn)}
.ver{font:600 .7rem var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--panel);color:var(--muted);cursor:pointer}
.ver.new{background:var(--accent);color:#1b1300;border-color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 .95rem var(--display);padding:9px 11px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input[type=search]{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 .9rem var(--display);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1300}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:4px 8px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:.88rem;color:var(--muted);padding:10px 0}
.status.err{color:var(--warn)}
.status.ok{color:var(--ok)}
/* Bienvenida */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:30px auto}
.hero h2{margin:0;font-size:1.3rem}
.hero p{margin:0;color:var(--muted)}
.hero .row-b{display:flex;gap:8px;flex-wrap:wrap}
/* Cuadro */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:74px 1fr auto;gap:6px 10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.pos{font:600 .95rem var(--mono);font-variant-numeric:tabular-nums;padding:3px 0 3px 8px;border-left:4px solid var(--accent)}
.row[data-tipo="IGA"] .pos{border-color:var(--iga)}
.row[data-tipo="Diferencial"] .pos{border-color:var(--dif)}
.row[data-tipo="Libre"] .pos{border-color:var(--free);color:var(--muted)}
.desc{min-width:0}
.desc strong{font-weight:600;display:block}
.desc .note{color:var(--muted);font-size:.86rem;margin-top:2px;display:block}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font:600 .7rem var(--display);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.amb{background:var(--accent-soft);color:var(--ink-accent)}
.edit{appearance:none;border:0;background:none;color:var(--ink-accent);font:600 .8rem var(--display);cursor:pointer;padding:2px 0}
.where{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
.goplan{appearance:none;font:600 .8rem var(--display);color:var(--fg);background:var(--accent-soft);border:1px solid transparent;border-radius:4px;padding:3px 8px;cursor:pointer}
.goplan:hover{border-color:var(--accent)}
.legendkey{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:4px 0 12px}
.legendkey i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* Plano */
.floors{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{appearance:none;display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 10px 5px 6px;font:600 .85rem var(--display);cursor:pointer;text-align:left}
.fchip .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 .68rem var(--mono)}
.fchip small{font-weight:400;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.planbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:78vh;position:relative}
.plan{position:relative;width:100%;margin:0 auto;user-select:none;-webkit-user-select:none;min-height:120px}
.plan.z2{width:200%}
.plan img{display:block;width:100%;max-width:none;filter:var(--plan-filter)}
.plan .noplan{padding:40px 16px;text-align:center;color:var(--muted)}
.plan.placing{cursor:crosshair}
.mk{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font:600 .72rem var(--mono);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.45);padding:0;transition:opacity .15s,transform .15s;z-index:2}
.plan.z2 .mk{width:34px;height:34px;font-size:.8rem}
.mk.dim{opacity:.18}
.mk.hit{transform:translate(-50%,-50%) scale(1.35);z-index:5}
.mk.sel{outline:3px solid var(--fg);outline-offset:2px;z-index:6}
.rb{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:22px;padding:0 4px;border-radius:3px;background:var(--panel);color:var(--box);border:2px solid var(--box);font:600 .64rem var(--mono);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.35);z-index:3}
.plan.z2 .rb{height:26px;font-size:.74rem}
.rb.has-unk{border-color:var(--unk);color:var(--unk)}
.rb.has-dud{border-color:var(--dud)}
.bdg{position:absolute;top:-8px;right:-8px;min-width:16px;height:16px;border-radius:8px;background:var(--unk);color:#fff;font:600 .6rem var(--mono);display:grid;place-items:center;padding:0 3px}
.bdg.amb{background:var(--dud)}
.rb.sel,.el.sel{outline:3px solid var(--accent);outline-offset:2px;z-index:6}
.el{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:7px;border:2.5px solid var(--sc);background:var(--panel);display:grid;place-items:center;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4);padding:0;z-index:4;color:var(--fg)}
.plan.z2 .el{width:36px;height:36px;font-size:18px}
.el.hit{transform:translate(-50%,-50%) scale(1.35)}
.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.links line{stroke-width:1.8;vector-effect:non-scaling-stroke}
.links line.caja{stroke:var(--box);stroke-dasharray:4 3;opacity:.55}
.links line.sys{opacity:.85}
.links line.d1{stroke-dasharray:7 4}
.links line.d2{stroke-dasharray:2 3}
.planhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hint{font-size:.85rem;color:var(--muted)}
.placebar{background:var(--accent-soft);color:var(--ink-accent);border-radius:6px;padding:8px 10px;font-size:.9rem;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:12px}
.room{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;text-align:left;font:inherit;color:inherit;cursor:pointer;appearance:none}
.room:hover{border-color:var(--accent)}
.room b{display:block;font-weight:600;margin-bottom:4px}
.room .dots{display:flex;gap:4px;flex-wrap:wrap}
.room .dots span{font:600 .7rem var(--mono);color:#fff;border-radius:3px;padding:1px 5px}
.room .dots em{font-style:normal;font-size:.85rem}
.layers{display:flex;gap:4px;flex-wrap:wrap}
.seg{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 .82rem var(--display);padding:6px 10px;border-radius:6px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.seg[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.seg i{display:inline-block;width:10px;height:10px;border-radius:2px}
.tray{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.85rem;color:var(--muted)}
.tray button{font:600 .78rem var(--mono)}
/* Conductores y pendientes */
.cond{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;cursor:pointer;width:100%}
.cond:hover .route{color:var(--ink-accent)}
.cond .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.route{font:500 .8rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.st{font:600 .66rem var(--display);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:999px;color:#fff;white-space:nowrap}
.st.desconocido,.st.averia,.st.vencida{background:var(--unk)}
.st.dudoso,.st.revisar,.st.pronto{background:var(--dud)}
.st.conocido,.st.ok{background:var(--ok)}
.ty{font:600 .66rem var(--display);text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.linkto{appearance:none;border:0;background:none;color:var(--ink-accent);font:600 .8rem var(--mono);cursor:pointer;padding:0}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:.88rem}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum .k{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;min-width:110px;text-align:left;font:inherit;color:inherit}
button.k{cursor:pointer;appearance:none}
button.k[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.sum .k b{font:600 1.4rem var(--mono);font-variant-numeric:tabular-nums}
.sum .k span{font-size:.78rem;color:var(--muted)}
.sum .k.unk b{color:var(--unk)} .sum .k.dud b{color:var(--dud)}
.grp{margin-bottom:14px}
.grp h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;display:flex;gap:6px;align-items:center}
.pend{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 12px;margin-bottom:6px}
.pend header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;margin:0}
.pend header b{font:600 .95rem var(--mono)}
/* Sistemas y mantenimiento */
.item{display:grid;grid-template-columns:36px 1fr auto;gap:4px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sc,var(--line));border-radius:6px;padding:8px 10px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;appearance:none;margin-bottom:6px}
.item:hover{border-color:var(--sc,var(--accent))}
.item .ico{font-size:20px;text-align:center}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600}
.item .t small{color:var(--muted);font-size:.84rem;display:block}
.item .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:6px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer;appearance:none}
.log .d{font:600 .82rem var(--mono);color:var(--muted);white-space:nowrap}
.log .x{min-width:0}
.log .x small{display:block;color:var(--muted);font-size:.82rem}
.log .c{font:600 .85rem var(--mono);white-space:nowrap}
/* Ajustes */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:1.05rem}
.floor{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.floor img,.floor .ph{width:64px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--bg);filter:var(--plan-filter)}
.floor .bt{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
/* Editor */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-top:3px solid var(--accent);border-radius:12px 12px 0 0;max-height:88%;overflow:auto;
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:1.15rem}
.sheet h3{margin:6px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;width:100%;min-width:0}
.field textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:4px}
.actions div{display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:.88rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fotos{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.foto{position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg);padding:0;cursor:pointer}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font:600 .75rem var(--display);cursor:pointer;display:grid;place-items:center;padding:0}
.addfoto{width:72px;height:72px;border:1px dashed var(--muted);border-radius:6px;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:.8rem;text-align:center}
.addfoto input{display:none}
.lb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:16px}
@media (max-width:480px){.row{grid-template-columns:62px 1fr}.meta{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}.where{grid-column:1/3}.grid2{grid-template-columns:1fr}.log{grid-template-columns:auto 1fr}.log .c{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.mk{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="titulo">Infraestructura de casa</h1>
    <span class="sub"><span id="sync">Sin carpeta</span><button class="ver" id="ver" hidden></button></span>
  </header>
  <nav class="tabs" role="tablist" id="tabs" hidden></nav>
  <div id="status" class="status" hidden></div>
  <main id="view"></main>
</div>
<div id="editor" hidden></div>
<div id="lightbox" hidden></div>
<script>
'use strict';
(function () {
  /* ---------- catálogo de sistemas ---------- */
  // Electricidad tiene además su propio modelo (cuadro, puntos, registros, conductores); estos "equipos"
  // son lo que no encaja ahí: un inversor, un cargador, una toma de tierra…
  const SISTEMAS = {
    electrico: { nombre: 'Electricidad (equipos)', corto: 'Electricidad', color: 'var(--s-ele)', icono: '⚡',
      tipos: { 'Cuadro secundario': '🔲', 'Toma de tierra': '⏚', 'Placas / inversor': '☀️', 'Cargador VE': '🔌', 'SAI': '🔋', 'Contador': '📟', 'Otro': '⚡' },
      tramos: ['Línea', 'Tubo vacío'] },
    calefaccion: { nombre: 'Calefacción', corto: 'Calefacción', color: 'var(--s-cal)', icono: '🔥',
      tipos: { 'Caldera': '🔥', 'Radiador': '♨️', 'Colector suelo radiante': '▦', 'Termostato': '🌡️', 'Bomba circuladora': '⟳', 'Vaso de expansión': '◍', 'Válvula / llave': '⊗', 'Purgador': '💧', 'Depósito de combustible': '🛢️', 'Chimenea / estufa': '🪵', 'Otro': '🔥' },
      tramos: ['Ida', 'Retorno', 'Ida y retorno'] },
    agua: { nombre: 'Agua (fontanería)', corto: 'Agua', color: 'var(--s-agu)', icono: '💧',
      tipos: { 'Contador / acometida': '📟', 'Llave de paso': '⊗', 'Grifo': '🚰', 'Ducha / bañera': '🚿', 'Inodoro': '🚽', 'Electrodoméstico': '🫧', 'Termo / ACS': '♨️', 'Descalcificador / filtro': '⚗️', 'Grupo de presión': '⟳', 'Toma exterior / riego': '🌱', 'Otro': '💧' },
      tramos: ['Fría', 'Caliente', 'Retorno ACS'] },
    saneamiento: { nombre: 'Saneamiento y desagües', corto: 'Desagües', color: 'var(--s-san)', icono: '🕳️',
      tipos: { 'Arqueta': '⬛', 'Bajante': '⬇️', 'Sumidero': '🕳️', 'Desagüe': '↘️', 'Bomba de achique': '⟳', 'Canalón': '🌧️', 'Acometida / fosa': '🏁', 'Otro': '🕳️' },
      tramos: ['Fecales', 'Pluviales', 'Mixto'] },
    gas: { nombre: 'Gas', corto: 'Gas', color: 'var(--s-gas)', icono: '🟡',
      tipos: { 'Contador': '📟', 'Llave': '⊗', 'Aparato': '🔥', 'Detector': '🚨', 'Depósito': '🛢️', 'Otro': '🟡' },
      tramos: ['Tubería'] },
    datos: { nombre: 'Telecomunicaciones y red', corto: 'Red / TV', color: 'var(--s-dat)', icono: '📶',
      tipos: { 'Router / ONT': '🌐', 'Switch': '🔀', 'Punto de acceso WiFi': '📶', 'Toma RJ45': '🔗', 'Toma TV': '📺', 'Antena': '📡', 'Cámara': '📷', 'Domótica': '🤖', 'Otro': '📶' },
      tramos: ['Cable de red', 'Coaxial', 'Fibra', 'Tubo vacío'] },
    clima: { nombre: 'Climatización y ventilación', corto: 'Clima', color: 'var(--s-cli)', icono: '❄️',
      tipos: { 'Split / interior': '❄️', 'Unidad exterior': '🌀', 'Recuperador': '♻️', 'Extractor': '💨', 'Rejilla': '▤', 'Termostato': '🌡️', 'Otro': '❄️' },
      tramos: ['Frigorífica', 'Conducto', 'Desagüe condensados'] },
    seguridad: { nombre: 'Seguridad y alarmas', corto: 'Seguridad', color: 'var(--s-seg)', icono: '🛡️',
      tipos: { 'Central de alarma': '🛡️', 'Sensor': '👁️', 'Detector de humo': '🚨', 'Detector de inundación': '💦', 'Sirena': '📢', 'Cerradura / acceso': '🔐', 'Extintor': '🧯', 'Otro': '🛡️' },
      tramos: ['Cable'] },
    otros: { nombre: 'Otros', corto: 'Otros', color: 'var(--s-otr)', icono: '📌',
      tipos: { 'Otro': '📌' }, tramos: ['Conexión'] }
  };
  const SIS_KEYS = Object.keys(SISTEMAS);
  const ESTADOS_EL = { ok: 'Funciona', revisar: 'Por revisar', averia: 'Averiado' };

  /* ---------- cuadro eléctrico (igual que el artefacto original) ---------- */
  const CCOL = { '13-14': 'var(--c13)', '15-16': 'var(--c15)', '17-18': 'var(--c17)', '19-20': 'var(--c19)', '21-22': 'var(--c21)', '35-36': 'var(--c19)' };
  const PALETA = ['#1f6fd1', '#d0362b', '#8a3fd1', '#1b8a4a', '#d98a00', '#0f7f86', '#c2185b', '#5b6b00', '#8a5a2b', '#3f51b5'];
  const TIPOS = ['Automático', 'Diferencial', 'IGA', 'Libre'];
  const CTIPOS = ['Potencia', 'Luz', 'Enchufes', 'TV', 'Teléfono', 'Telefonillo', 'Mixto', 'Tubo vacío'];
  const ESTADOS = ['conocido', 'dudoso', 'desconocido'];
  const ELEC = ['circuitos', 'puntos', 'cajas', 'conductores'];

  /* ---------- estado ---------- */
  let root = null, casa = null, lastMod = 0, pickerBusy = false;
  const planUrls = {}, fotoUrls = {};
  let view = 'cuadro', planta = '', filt = '', q = '', qs = '', zoom = false, placing = null, selId = null, pendFilt = 'sin', sysFilt = '', mantFilt = '';
  let capas = null;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const opts = (arr, sel) => arr.map(t => `<option${t === sel ? ' selected' : ''}>${esc(t)}</option>`).join('');

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  try {
    view = ls('hm.view') || view; zoom = ls('hm.zoom') === '1'; planta = ls('hm.planta') || '';
    const c = JSON.parse(ls('hm.capas') || 'null'); if (Array.isArray(c)) capas = new Set(c);
  } catch (e) { }
  if (!capas) capas = new Set(['puntos', 'registros', ...SIS_KEYS]);
  const saveCapas = () => ls('hm.capas', JSON.stringify([...capas]));

  /* ---------- acceso a datos ---------- */
  const E = () => casa.electrico;
  const circuitos = () => E().circuitos;
  const puntos = () => E().puntos;
  const cajas = () => E().cajas;
  const conds = () => E().conductores;
  const coll = n => ELEC.includes(n) ? casa.electrico[n] : casa[n];
  const plantas = () => casa.plantas;
  const plantaDe = id => plantas().find(p => p.id === id);
  const plantaNombre = id => (plantaDe(id) || {}).nombre || 'Sin planta';

  const colIdx = {};
  const col = pos => { if (CCOL[pos]) return CCOL[pos]; if (!pos) return 'var(--cx)'; if (!(pos in colIdx)) { let h = 0; for (const ch of String(pos)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; colIdx[pos] = PALETA[h % PALETA.length]; } return colIdx[pos]; };
  const short = pos => String(pos || '?').split('-')[0];
  const circ = pos => circuitos().find(c => c.pos === pos);
  const circDesc = pos => { const c = circ(pos); return c ? c.desc : 'Sin asignar'; };
  const caja = code => cajas().find(k => k.codigo === code);
  const condsOf = code => conds().filter(n => n.caja === code).sort((a, b) => (+a.orden || 0) - (+b.orden || 0));
  const tag = code => String(code).replace(/-C(\d+)$/, '$1').replace(/\s+/g, '');
  const placed = k => k.x !== null && k.x !== undefined && k.x !== '' && !isNaN(+k.x);
  const elem = id => casa.elementos.find(e => e.id === id);
  const sis = k => SISTEMAS[k] || SISTEMAS.otros;
  const icono = e => sis(e.sistema).tipos[e.tipo] || sis(e.sistema).icono;
  const nombreEl = e => e.nombre || e.tipo || sis(e.sistema).corto;
  const tramosDe = id => casa.tramos.filter(t => t.desde === id || t.hasta === id);

  /* ---------- fechas y revisiones ---------- */
  const hoy = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  function sumaMeses(f, n) { const d = new Date(f + 'T12:00:00'); if (isNaN(d)) return ''; d.setMonth(d.getMonth() + (+n)); return d.toISOString().slice(0, 10); }
  const fmt = f => { if (!f) return ''; const [y, m, d] = f.split('-'); return d ? `${d}/${m}/${y}` : f; };
  function proxima(e) { const base = e.ultimaRevision || e.instalado; return e.revisionMeses && base ? sumaMeses(base, e.revisionMeses) : ''; }
  function aviso(e) {
    if (e.estado === 'averia') return { cls: 'averia', txt: 'Averiado' };
    const p = proxima(e);
    if (p && p <= hoy()) return { cls: 'vencida', txt: 'Revisión vencida' };
    if (e.estado === 'revisar') return { cls: 'revisar', txt: 'Por revisar' };
    if (p && p <= sumaMeses(hoy(), 2)) return { cls: 'pronto', txt: 'Revisión ' + fmt(p) };
    return null;
  }

  /* ---------- interfaz general ---------- */
  function setStatus(m, err, ok) { const s = $('#status'); s.hidden = !m; s.textContent = m || ''; s.classList.toggle('err', !!err); s.classList.toggle('ok', !!ok); }
  function setSync(m, err) { const s = $('#sync'); s.textContent = m; s.classList.toggle('err', !!err); }
  let statusTimer = null;
  function flash(m) { setStatus(m, false, true); clearTimeout(statusTimer); statusTimer = setTimeout(() => setStatus(''), 4000); }

  // Botón atrás de Android: mientras no se esté en la portada (cuadro sin hojas abiertas) se mantiene una
  // entrada de historial propia, que es la que recoge el toque. Sin esto, atrás cierra la app.
  function marca() { if (!(history.state && history.state.hm)) history.pushState({ hm: 1 }, ''); }
  window.addEventListener('popstate', () => {
    if ($('#lightbox').hidden === false) { $('#lightbox').hidden = true; $('#lightbox').innerHTML = ''; }
    else if (!$('#editor').hidden) { closeSheet(); }
    else if (view !== 'cuadro') { placing = null; view = 'cuadro'; ls('hm.view', view); render(); }
    if (view !== 'cuadro' || !$('#editor').hidden) marca();
  });

  const VISTAS = [['cuadro', 'Cuadro'], ['plano', 'Planos'], ['sistemas', 'Sistemas'], ['mant', 'Mantenimiento'], ['pend', 'Sin resolver'], ['ajustes', 'Ajustes']];
  function tabs() {
    const nu = conds().filter(n => n.estado === 'desconocido').length;
    const na = casa.elementos.filter(e => { const a = aviso(e); return a && a.cls !== 'pronto'; }).length;
    const t = $('#tabs'); t.hidden = false;
    t.innerHTML = VISTAS.map(([k, l]) => `<button class="tab" role="tab" data-view="${k}" aria-selected="${view === k}">${l}${k === 'pend' && nu ? ' · ' + nu : ''}${k === 'mant' && na ? ' · ' + na : ''}</button>`).join('');
    t.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.view));
  }
  function go(v, o) {
    o = o || {}; view = v; filt = o.filt || ''; selId = o.sel || null; placing = null;
    if (o.planta) planta = o.planta;
    ls('hm.view', v); if (planta) ls('hm.planta', planta);
    if (v !== 'cuadro') marca();
    render(); if (!o.sel) window.scrollTo(0, 0);
  }
  function render() {
    if (!casa) return;
    $('#titulo').textContent = casa.casa.nombre || 'Infraestructura de casa';
    document.title = casa.casa.nombre || 'Infraestructura de casa';
    tabs();
    const v = $('#view');
    if (!plantaDe(planta)) planta = plantas().length ? plantas()[0].id : '';
    if (view === 'cuadro') renderCuadro(v);
    else if (view === 'plano') renderPlan(v);
    else if (view === 'sistemas') renderSistemas(v);
    else if (view === 'mant') renderMant(v);
    else if (view === 'pend') renderPend(v);
    else if (view === 'ajustes') renderAjustes(v);
    else { view = 'cuadro'; renderCuadro(v); }
  }
  function keepFocus(id, fn) { const i = $('#' + id); const p = i.selectionStart; fn(); const n = $('#' + id); n.focus(); try { n.setSelectionRange(p, p); } catch (e) { } }

  /* ---------- Cuadro ---------- */
  function renderCuadro(v) {
    const qq = norm(q);
    const list = circuitos().slice().sort((a, b) => (+a.orden || 999) - (+b.orden || 999) || String(a.pos).localeCompare(String(b.pos), 'es', { numeric: true }))
      .filter(c => !qq || norm([c.pos, c.desc, c.notas, c.tipo].join(' ')).includes(qq) || puntos().some(p => p.circuito === c.pos && norm(p.estancia).includes(qq)));
    v.innerHTML = `<div class="bar"><input id="q" type="search" placeholder="Buscar: caldera, 19-20, garaje…" aria-label="Buscar" value="${esc(q)}"><button class="btn primary" id="addc">+ Posición</button></div>
    <div class="legendkey"><span><i style="background:var(--iga)"></i>IGA</span><span><i style="background:var(--dif)"></i>Diferencial</span><span><i style="background:var(--accent)"></i>Automático</span><span><i style="background:var(--free)"></i>Libre</span></div>
    <div class="rows">${list.map(c => {
      const pts = puntos().filter(p => p.circuito === c.pos);
      const by = {}; pts.forEach(p => by[p.planta] = (by[p.planta] || 0) + 1);
      return `<div class="row" data-tipo="${esc(c.tipo)}">
        <span class="pos">${esc(c.pos)}</span>
        <span class="desc"><strong>${esc(c.desc || '—')}</strong>${c.notas ? `<span class="note">${esc(c.notas)}</span>` : ''}</span>
        <span class="meta">${c.tipo !== 'Automático' ? `<span class="pill">${esc(c.tipo)}</span>` : ''}${c.dudoso ? '<span class="pill warn">Por verificar</span>' : ''}<button class="edit" data-edit="${esc(c.id)}">Editar</button></span>
        ${Object.keys(by).length ? `<span class="where">${Object.entries(by).map(([pl, n]) => `<button class="goplan" data-pl="${esc(pl)}" data-pos="${esc(c.pos)}">Ver en ${esc(plantaNombre(pl).toLowerCase())} · ${n}</button>`).join('')}</span>` : ''}
      </div>`;
    }).join('')}</div>${list.length ? '' : `<p class="status">${circuitos().length ? 'Nada coincide con la búsqueda.' : 'El cuadro está vacío. Añade la primera posición con «+ Posición».'}</p>`}`;
    $('#q').addEventListener('input', () => keepFocus('q', () => { q = $('#q').value; renderCuadro(v); }));
    $('#addc').onclick = () => openCirc({ tipo: 'Automático' });
    v.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const c = circuitos().find(x => x.id === b.dataset.edit); openCirc({ ...c }, c.id); });
    v.querySelectorAll('.goplan').forEach(b => b.onclick = () => { capas.add('puntos'); saveCapas(); go('plano', { planta: b.dataset.pl, filt: b.dataset.pos }); });
  }

  function boxState(code) { const cs = condsOf(code); return { unk: cs.filter(n => n.estado === 'desconocido').length, dud: cs.filter(n => n.estado === 'dudoso').length, n: cs.length }; }

  /* ---------- Plano ---------- */
  async function planUrl(id) {
    if (planUrls[id] !== undefined) return planUrls[id];
    const p = plantaDe(id); if (!p || !p.plano) return planUrls[id] = '';
    try { planUrls[id] = URL.createObjectURL(await leeArchivo(p.plano)); }
    catch (e) { planUrls[id] = ''; setStatus(`No encuentro el plano «${p.plano}» en la carpeta. Cámbialo en Ajustes.`, true); }
    return planUrls[id];
  }

  function renderPlan(v) {
    if (!plantas().length) {
      v.innerHTML = `<div class="hero"><h2>Aún no hay plantas</h2><p>Añade una planta en Ajustes y elige la imagen de su plano (foto o captura vale).</p><div class="row-b"><button class="btn primary" id="toaj">Ir a Ajustes</button></div></div>`;
      $('#toaj').onclick = () => go('ajustes'); return;
    }
    const showP = capas.has('puntos'), showR = capas.has('registros');
    const pts = showP ? puntos().filter(p => p.planta === planta) : [];
    const ks = cajas().filter(k => k.planta === planta);
    const kp = showR ? ks.filter(placed) : [];
    const els = casa.elementos.filter(e => e.planta === planta);
    const ep = els.filter(e => placed(e) && capas.has(e.sistema in SISTEMAS ? e.sistema : 'otros'));
    const unplaced = [...(showR ? ks.filter(k => !placed(k)).map(k => ({ k })) : []), ...els.filter(e => !placed(e) && capas.has(e.sistema)).map(e => ({ e }))];
    const used = [...new Set(pts.map(p => p.circuito))].sort((a, b) => String(a).localeCompare(String(b), 'es', { numeric: true }));
    const rooms = {};
    pts.forEach(p => (rooms[p.estancia] = rooms[p.estancia] || { p: [], e: [] }).p.push(p));
    ep.forEach(e => { if (e.estancia) (rooms[e.estancia] = rooms[e.estancia] || { p: [], e: [] }).e.push(e); });
    // líneas: entre registros enlazados por conductores, y tramos entre elementos de la misma planta
    const pairs = new Set();
    if (showR) conds().forEach(n => { const a = caja(n.caja), b = caja(n.enlace); if (a && b && a !== b && a.planta === planta && b.planta === planta && placed(a) && placed(b)) pairs.add([a.codigo, b.codigo].sort().join('|')); });
    const lines = casa.tramos.map(t => { const a = elem(t.desde), b = elem(t.hasta); if (!a || !b || a.planta !== planta || b.planta !== planta || !placed(a) || !placed(b) || !capas.has(t.sistema || a.sistema)) return ''; const s = sis(t.sistema || a.sistema); const di = Math.max(0, s.tramos.indexOf(t.tipo)) % 3; return `<line class="sys${di ? ' d' + di : ''}" style="stroke:${s.color}" x1="${a.x * 1000}" y1="${a.y * 1000}" x2="${b.x * 1000}" y2="${b.y * 1000}"/>`; }).join('');
    const sysUsed = new Set(casa.elementos.map(e => e.sistema));
    const what = placing ? (placing.kind === 'caja' ? 'el registro ' + esc(placing.code || '') : placing.kind === 'el' ? (placing.new ? 'el nuevo elemento' : 'el elemento') : 'el punto de luz') : '';
    const pl = plantaDe(planta);
    v.innerHTML = `${placing ? `<div class="placebar"><span>Toca el plano donde está ${what}.</span><button class="btn" id="cancelplace">Cancelar</button></div>` : ''}
    <div class="floors layers" role="group" aria-label="Planta">${plantas().map(p => `<button class="seg" data-pl="${esc(p.id)}" aria-pressed="${p.id === planta}">${esc(p.nombre)}</button>`).join('')}</div>
    <div class="planhead">
      <div class="layers" role="group" aria-label="Capas">
        <button class="seg" data-capa="puntos" aria-pressed="${showP}"><i style="background:var(--c13);border-radius:50%"></i>Puntos de luz</button>
        <button class="seg" data-capa="registros" aria-pressed="${showR}"><i style="border:2px solid var(--box)"></i>Registros</button>
        ${SIS_KEYS.filter(k => sysUsed.has(k)).map(k => `<button class="seg" data-capa="${k}" aria-pressed="${capas.has(k)}"><i style="background:${SISTEMAS[k].color}"></i>${esc(SISTEMAS[k].corto)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="zoom">${zoom ? 'Ajustar' : 'Ampliar ×2'}</button><button class="btn" id="addk">+ Registro</button><button class="btn" id="addp">+ Punto de luz</button><button class="btn primary" id="adde">+ Elemento</button></div></div>
    ${showP && used.length ? `<div class="filters">${used.map(pos => `<button class="fchip" aria-pressed="${filt === pos}" data-f="${esc(pos)}"><span class="dot" style="background:${col(pos)}">${esc(short(pos))}</span>${esc(pos || 'Sin asignar')} <small>${esc(circDesc(pos))}</small></button>`).join('')}</div>` : ''}
    <div class="planbox" id="planbox"><div class="plan${zoom ? ' z2' : ''}${placing ? ' placing' : ''}" id="plan">${pl && pl.plano ? `<img id="planimg" alt="Plano ${esc(pl.nombre.toLowerCase())}" draggable="false"${planUrls[planta] ? ` src="${planUrls[planta]}"` : ''}>` : `<div class="noplan">Esta planta no tiene imagen de plano. Puedes marcar igualmente, o elegir una en Ajustes.</div>`}
      <svg class="links" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">${[...pairs].map(s => { const [a, b] = s.split('|').map(caja); return `<line class="caja" x1="${a.x * 1000}" y1="${a.y * 1000}" x2="${b.x * 1000}" y2="${b.y * 1000}"/>`; }).join('')}${lines}</svg>
      ${pts.map(p => `<button class="mk${filt && p.circuito !== filt ? ' dim' : ''}${p.id === selId ? ' sel' : ''}" data-id="${esc(p.id)}" style="left:${(+p.x || .5) * 100}%;top:${(+p.y || .5) * 100}%;background:${col(p.circuito)}" title="${esc((p.circuito || 'Sin asignar') + ' · ' + p.estancia)}" aria-label="${esc((p.circuito || 'Sin asignar') + ', ' + p.estancia)}">${esc(short(p.circuito))}</button>`).join('')}
      ${kp.map(k => { const s = boxState(k.codigo); return `<button class="rb${s.unk ? ' has-unk' : s.dud ? ' has-dud' : ''}${k.codigo === selId ? ' sel' : ''}" data-k="${esc(k.codigo)}" style="left:${k.x * 100}%;top:${k.y * 100}%" aria-label="Registro ${esc(k.codigo)}${s.unk ? `, ${s.unk} sin identificar` : ''}">${esc(tag(k.codigo))}${s.unk ? `<span class="bdg">${s.unk}</span>` : ''}</button>`; }).join('')}
      ${ep.map(e => { const a = aviso(e); return `<button class="el${e.id === selId ? ' sel' : ''}" data-e="${esc(e.id)}" style="--sc:${sis(e.sistema).color};left:${e.x * 100}%;top:${e.y * 100}%" title="${esc(nombreEl(e) + (e.estancia ? ' · ' + e.estancia : ''))}" aria-label="${esc(sis(e.sistema).corto + ': ' + nombreEl(e))}">${esc(icono(e))}${a ? `<span class="bdg${a.cls === 'pronto' || a.cls === 'revisar' ? ' amb' : ''}">!</span>` : ''}</button>`; }).join('')}
    </div></div>
    ${unplaced.length ? `<div class="tray">Sin ubicar en el plano: ${unplaced.map(u => u.k ? `<button class="btn" data-k="${esc(u.k.codigo)}">${esc(u.k.codigo)}</button>` : `<button class="btn" data-e="${esc(u.e.id)}">${esc(icono(u.e) + ' ' + nombreEl(u.e))}</button>`).join('')}</div>` : ''}
    <p class="hint">${showR ? 'Registros: recuadro rojo = tiene conductores sin identificar (el número dice cuántos). Ámbar = alguno dudoso. ' : ''}${ep.length ? 'Elementos: «!» rojo = averiado o revisión vencida; ámbar = por revisar o revisión próxima. Líneas de color = conexiones entre elementos (discontinua = retorno). ' : ''}${pl && pl.nota && showP ? esc(pl.nota) : ''}</p>
    ${Object.keys(rooms).length ? `<div class="rooms">${Object.keys(rooms).sort((a, b) => a.localeCompare(b, 'es')).map(r => `<button class="room" data-room="${esc(r)}"><b>${esc(r || 'Sin estancia')}</b><span class="dots">${rooms[r].p.map(p => `<span style="background:${col(p.circuito)}">${esc(p.circuito || '?')}</span>`).join('')}${rooms[r].e.map(e => `<em title="${esc(nombreEl(e))}">${esc(icono(e))}</em>`).join('')}</span></button>`).join('')}</div>` : ''}`;

    if (pl && pl.plano && !planUrls[planta]) { const id = planta; planUrl(id).then(u => { const i = $('#planimg'); if (u && i && id === planta) i.src = u; }); }
    $('#zoom').onclick = () => { zoom = !zoom; ls('hm.zoom', zoom ? '1' : '0'); renderPlan(v); };
    $('#addp').onclick = () => { capas.add('puntos'); saveCapas(); placing = { kind: 'punto', new: true }; renderPlan(v); };
    $('#addk').onclick = () => openCaja({ planta, x: null, y: null });
    $('#adde').onclick = () => { placing = { kind: 'el', new: true }; renderPlan(v); };
    if (placing) $('#cancelplace').onclick = () => { placing = null; renderPlan(v); };
    v.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { planta = b.dataset.pl; ls('hm.planta', planta); filt = ''; selId = null; renderPlan(v); });
    v.querySelectorAll('[data-capa]').forEach(b => b.onclick = () => { const k = b.dataset.capa; capas.has(k) ? capas.delete(k) : capas.add(k); saveCapas(); renderPlan(v); });
    v.querySelectorAll('.fchip').forEach(b => b.onclick = () => { filt = filt === b.dataset.f ? '' : b.dataset.f; renderPlan(v); });
    v.querySelectorAll('.mk').forEach(b => b.onclick = ev => { if (placing) return; ev.stopPropagation(); const p = puntos().find(x => x.id === b.dataset.id); selId = p.id; openPunto({ ...p }, p.id); });
    v.querySelectorAll('[data-k]').forEach(b => b.onclick = ev => { if (placing) return; ev.stopPropagation(); selId = b.dataset.k; openBox(b.dataset.k); });
    v.querySelectorAll('[data-e]').forEach(b => b.onclick = ev => { if (placing) return; ev.stopPropagation(); selId = b.dataset.e; openEl({ ...elem(b.dataset.e) }, b.dataset.e); });
    v.querySelectorAll('.room').forEach(b => b.onclick = () => {
      const r = rooms[b.dataset.room]; const ids = r.p.map(p => p.id).concat(r.e.map(e => e.id));
      v.querySelectorAll('.mk,.el').forEach(m => m.classList.toggle('hit', ids.includes(m.dataset.id || m.dataset.e)));
      const m = v.querySelector('.mk.hit,.el.hit'); m && m.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
      setTimeout(() => v.querySelectorAll('.hit').forEach(m => m.classList.remove('hit')), 1600);
    });
    if (selId) { const m = v.querySelector('.rb.sel,.mk.sel,.el.sel'); m && setTimeout(() => m.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' }), 80); }
    $('#plan').addEventListener('click', ev => {
      if (!placing) return;
      const r = $('#plan').getBoundingClientRect();
      const x = Math.round(Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) * 1000) / 1000, y = Math.round(Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height)) * 1000) / 1000;
      const p = placing; placing = null;
      if (p.kind === 'caja') { const k = cajas().find(z => z.id === p.id); if (k) { Object.assign(k, { x, y, planta }); save(); } selId = p.code; renderPlan(v); return; }
      if (p.kind === 'el') {
        if (p.new) { renderPlan(v); openEl({ planta, x, y, sistema: ls('hm.sistema') || 'calefaccion', estado: 'ok' }); }
        else { const e = elem(p.id); if (e) { Object.assign(e, { x, y, planta }); save(); } selId = p.id; renderPlan(v); }
        return;
      }
      if (p.new) { renderPlan(v); openPunto({ planta, circuito: filt || '', x, y }); }
      else { const d = { ...p.data, x, y }; renderPlan(v); openPunto(d, p.id); }
    });
  }

  /* ---------- Sin resolver ---------- */

    ${plantas().map(p => p.id).concat(['']).filter(f => byFloor[f]).map(f => `<div class="grp"><h3>${esc(plantaNombre(f))}</h3>${Object.keys(byFloor[f]).sort().map(code => `<div class="pend"><header><b>${esc(code)}</b><button class="linkto" data-open="${esc(code)}">Ver en el plano →</button></header>${byFloor[f][code].map(condHTML).join('')}</div>`).join('')}</div>`).join('') || '<p class="status">No queda ningún conductor por identificar.</p>'}`;

    v.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const n = conds().find(x => x.id === b.dataset.c); openCond({ ...n }, n.id); });
    v.querySelectorAll('[data-circ]').forEach(b => b.onclick = () => { const c = circuitos().find(x => x.id === b.dataset.circ); openCirc({ ...c }, c.id); });
  }

  function renderSistemas(v) {

  /* ---------- Mantenimiento ---------- */
  function renderMant(v) {
    const pend = casa.elementos.map(e => ({ e, a: aviso(e), p: proxima(e) })).filter(x => x.a).sort((a, b) => (a.p || '9') .localeCompare(b.p || '9'));
    const plan = casa.elementos.filter(e => proxima(e) && !aviso(e)).sort((a, b) => proxima(a).localeCompare(proxima(b)));
    const logs = casa.historial.filter(h => !mantFilt || h.sistema === mantFilt).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    const gasto = logs.reduce((s, h) => s + (parseFloat(String(h.coste || '').replace(',', '.')) || 0), 0);
    const sysOpts = [['', 'Todos'], ...SIS_KEYS.map(k => [k, SISTEMAS[k].corto]), ['cuadro', 'Cuadro eléctrico'], ['general', 'General']];
    v.innerHTML = `<div class="sum"><div class="k unk"><b>${pend.filter(x => x.a.cls !== 'pronto').length}</b><span>averías / vencidas</span></div><div class="k dud"><b>${pend.filter(x => x.a.cls === 'pronto').length}</b><span>revisiones en 2 meses</span></div><div class="k"><b>${casa.historial.length}</b><span>anotaciones</span></div><div class="k"><b>${gasto.toLocaleString('es-ES', { maximumFractionDigits: 0 })} €</b><span>gasto anotado${mantFilt ? ' (filtro)' : ''}</span></div></div>

    ${plan.length ? `<div class="grp"><h3>Próximas revisiones</h3>${plan.map(e => `<button class="log" data-e="${esc(e.id)}"><span class="d">${esc(fmt(proxima(e)))}</span><span class="x">${esc(icono(e) + ' ' + nombreEl(e))}<small>${esc(sis(e.sistema).corto + ' · cada ' + e.revisionMeses + ' meses')}</small></span><span></span></button>`).join('')}</div>` : ''}
    <div class="grp"><h3>Historial de intervenciones</h3>
      <div class="bar"><select id="mf" class="btn" aria-label="Filtrar por sistema">${sysOpts.map(([k, l]) => `<option value="${k}"${k === mantFilt ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select><span style="flex:1"></span><button class="btn primary" id="addh">+ Anotación</button></div>
      ${logs.map(logHTML).join('') || '<p class="status">Sin anotaciones. Apunta aquí revisiones, averías, reparaciones y quién las hizo.</p>'}</div>`;
    v.querySelectorAll('[data-e]').forEach(b => b.onclick = () => openEl({ ...elem(b.dataset.e) }, b.dataset.e));
    v.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { const h = casa.historial.find(x => x.id === b.dataset.h); openNota({ ...h }, h.id); });
    $('#mf').onchange = () => { mantFilt = $('#mf').value; renderMant(v); };
    $('#addh').onclick = () => openNota({ fecha: hoy(), sistema: mantFilt || 'general' });

  function sisNombre(k) { return k === 'cuadro' ? 'Cuadro eléctrico' : k === 'general' ? 'General' : sis(k).corto; }
  function logHTML(h) {

  }

  /* ---------- Ajustes ---------- */
  function renderAjustes(v) {
    v.innerHTML = `<div class="card"><h2>Casa</h2>
      <div class="field"><label for="a-nom">Nombre</label><input id="a-nom" value="${esc(casa.casa.nombre)}"></div>
      <div class="field"><label for="a-dir">Dirección / notas</label><textarea id="a-dir">${esc(casa.casa.notas)}</textarea></div></div>
    <div class="card"><h2>Plantas y planos</h2>
      <p class="hint" style="margin:0">El orden de aquí es el de los botones del plano. La imagen se copia a la carpeta <code>planos/</code>. Las marcas se guardan en proporción a la imagen: si cambias un plano por otro con distinto encuadre, habrá que moverlas.</p>
      ${plantas().map((p, i) => `<div class="floor"><span id="th-${esc(p.id)}">${p.plano ? '<span class="ph" style="display:block"></span>' : '<span class="ph" style="display:block"></span>'}</span>
        <div class="field"><input data-pn="${esc(p.id)}" value="${esc(p.nombre)}" aria-label="Nombre de la planta"><small class="hint">${esc(p.plano || 'sin imagen')} · ${cuentaPlanta(p.id)} marcas</small></div>
        <div class="bt"><button class="btn small" data-up="${i}"${i ? '' : ' disabled'} aria-label="Subir">↑</button><button class="btn small" data-dn="${i}"${i < plantas().length - 1 ? '' : ' disabled'} aria-label="Bajar">↓</button><label class="btn small">Plano…<input type="file" accept="image/*" data-img="${esc(p.id)}" hidden></label><button class="btn small danger" data-delp="${esc(p.id)}">Borrar</button></div></div>`).join('')}
      <div><button class="btn primary" id="addpl">+ Planta</button></div><div id="pcf"></div></div>
    <div class="card"><h2>Carpeta de datos</h2>
      <p style="margin:0">Guardando en la carpeta <b>${esc(root ? root.name : '—')}</b>: <code>casa.json</code>, <code>planos/</code>, <code>fotos/</code> y copias de seguridad automáticas en <code>copias/</code>.</p>
      <div class="row-b" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="chdir">Cambiar de carpeta</button><button class="btn" id="exp">Descargar copia (.json)</button><button class="btn" id="reload">Releer de la carpeta</button></div></div>`;
    plantas().forEach(async p => { if (!p.plano) return; const u = await planUrl(p.id); const s = $('#th-' + CSS.escape(p.id)); if (u && s) s.innerHTML = `<img src="${u}" alt="">`; });
    $('#a-nom').onchange = () => { casa.casa.nombre = $('#a-nom').value.trim(); save(); render(); };
    $('#a-dir').onchange = () => { casa.casa.notas = $('#a-dir').value; save(); };
    v.querySelectorAll('[data-pn]').forEach(i => i.onchange = () => { const p = plantaDe(i.dataset.pn); const n = i.value.trim(); if (!n) { i.value = p.nombre; return; } p.nombre = n; save(); tabs(); });
    const mv = (i, d) => { const a = plantas(); [a[i], a[i + d]] = [a[i + d], a[i]]; save(); renderAjustes(v); };
    v.querySelectorAll('[data-up]').forEach(b => b.onclick = () => mv(+b.dataset.up, -1));
    v.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => mv(+b.dataset.dn, 1));
