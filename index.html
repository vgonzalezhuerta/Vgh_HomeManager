    v.querySelectorAll('[data-delp]').forEach(b => b.onclick = () => {
      const p = plantaDe(b.dataset.delp); const n = cuentaPlanta(p.id);
      $('#pcf').innerHTML = `<div class="confirm">${n ? `«${esc(p.nombre)}» tiene ${n} marcas. Si la borras, quedarán sin planta (no se pierden, pero no se verán en ningún plano). ` : ''}¿Borrar la planta «${esc(p.nombre)}»? <button class="btn danger" id="yes">Sí, borrar</button> <button class="btn" id="no">No</button></div>`;
      $('#no').onclick = () => $('#pcf').innerHTML = '';
      $('#yes').onclick = () => { casa.plantas = plantas().filter(x => x !== p); save(); renderAjustes(v); };
    });
    $('#addpl').onclick = () => openPlanta();
    $('#chdir').onclick = () => pickRoot();
    $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(casa, null, 1)], { type: 'application/json' })); a.download = `casa-${hoy()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
    $('#reload').onclick = () => cargaCasa(true);
  }
  function cuentaPlanta(id) { return puntos().filter(p => p.planta === id).length + cajas().filter(k => k.planta === id).length + casa.elementos.filter(e => e.planta === id).length; }
  async function ponPlano(p, file) {
    try {
      setStatus('Copiando el plano a la carpeta…');
      const ext = (file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace(/[^a-z0-9]/g, '');
      const name = `planos/${slug(p.nombre)}-${Date.now().toString(36)}.${ext}`;
      await escribe(name, file);
      p.plano = name; delete planUrls[p.id]; save(); setStatus('');
    } catch (e) { setStatus('No se pudo copiar el plano: ' + e.message, true); }
  }
  const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'planta';
  function openPlanta() {
    sheet(`<h2>Nueva planta</h2>
      <div class="field"><label for="f-pn">Nombre</label><input id="f-pn" placeholder="Planta baja, Sótano, Jardín…"></div>
      <div class="field"><label for="f-pi">Imagen del plano (opcional)</label><input id="f-pi" type="file" accept="image/*"></div>
      <p class="hint" style="margin:0">Una foto del plano en papel vale. Mejor recortada y derecha: las marcas se colocan sobre ella.</p>
      <div class="actions"><div></div><div><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Añadir</button></div></div>`);
    $('#save').onclick = async () => {
      const nombre = $('#f-pn').value.trim(); if (!nombre) return msg('Pon un nombre a la planta.');
      let id = slug(nombre); while (plantaDe(id)) id += '-2';
      const p = { id, nombre, plano: '' }; casa.plantas.push(p);
      const f = $('#f-pi').files[0]; $('#save').disabled = true;
      if (f) await ponPlano(p, f);
      save(); planta = id; ls('hm.planta', id); closeSheet();
    };
  }

  /* ---------- hojas de edición ---------- */
  function sheet(html) { const ed = $('#editor'); ed.innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="in">${html}<div id="cf"></div></div></div>`; ed.hidden = false; marca(); $('#scrim').onclick = closeSheet; const c = $('#cancel'); c && (c.onclick = closeSheet); const f = ed.querySelector('input:not([type=file]):not([type=checkbox]),textarea'); if (f && !f.value && matchMedia('(pointer:fine)').matches) f.focus(); }
  function closeSheet() { $('#editor').hidden = true; $('#editor').innerHTML = ''; render(); }
  function msg(t) { $('#cf').innerHTML = `<div class="confirm">${t}</div>`; }
  function actions(id, extra) { return `<div class="actions"><div>${id ? '<button class="btn danger" id="del">Borrar</button>' : ''}${extra || ''}</div><div><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Guardar</button></div></div>`; }
  function wireDel(n, id, after) {
    const d = $('#del'); if (!d) return;
    d.onclick = () => {
      msg('¿Borrar definitivamente? <button class="btn danger" id="yes">Sí, borrar</button>');
      $('#yes').onclick = () => { const a = coll(n); const i = a.findIndex(x => x.id === id); if (i >= 0) a.splice(i, 1); if (n === 'elementos') casa.tramos = casa.tramos.filter(t => t.desde !== id && t.hasta !== id); save(); after ? after() : closeSheet(); };
    };
  }
  function write(n, id, data, after) {
    const a = coll(n);
    if (!id) id = uid();
    const i = a.findIndex(x => x.id === id);
    if (i >= 0) a[i] = { id, ...data }; else a.push({ id, ...data });
    save(); after ? after(id) : closeSheet();
  }

  function openCirc(d, id) {
    sheet(`<h2>${id ? 'Posición ' + esc(d.pos) : 'Nueva posición del cuadro'}</h2>
      <div class="grid2"><div class="field"><label for="f-pos">Posición</label><input id="f-pos" value="${esc(d.pos)}" placeholder="p. ej. 37-38"></div>
      <div class="field"><label for="f-tipo">Tipo</label><select id="f-tipo">${opts(TIPOS, d.tipo)}</select></div></div>
      <div class="field"><label for="f-desc">Qué alimenta</label><input id="f-desc" value="${esc(d.desc)}"></div>
      <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas">${esc(d.notas)}</textarea></div>
      <label class="check"><input type="checkbox" id="f-dud"${d.dudoso ? ' checked' : ''}> Por verificar</label>${actions(id)}`);
    wireDel('circuitos', id);
    $('#save').onclick = () => {
      const pos = $('#f-pos').value.trim(); if (!pos) return msg('Indica la posición (p. ej. 37-38).');
      if (circuitos().some(c => c.pos === pos && c.id !== id)) return msg('Ya existe esa posición en el cuadro.');
      const old = id && d.pos !== pos ? d.pos : null;
      write('circuitos', id, { pos, tipo: $('#f-tipo').value, desc: $('#f-desc').value.trim(), notas: $('#f-notas').value.trim(), dudoso: $('#f-dud').checked, orden: parseInt(pos, 10) || 999 });
      // renombrar una posición arrastra sus puntos y conductores, para que no queden huérfanos
      if (old) { puntos().forEach(p => { if (p.circuito === old) p.circuito = pos; }); conds().forEach(n => { if (n.circuito === old) n.circuito = pos; }); save(); render(); }
    };
  }

  function openPunto(d, id) {
    const rooms = estancias();
    const c = circ(d.circuito);
    sheet(`<h2>${id ? 'Punto de luz' : 'Nuevo punto de luz'} · ${esc(plantaNombre(d.planta))}</h2>
      ${c ? `<p class="hint" style="margin:0"><b style="color:var(--fg)">${esc(c.pos)}</b> · ${esc(c.desc)}${c.notas ? ' — ' + esc(c.notas) : ''}</p>` : ''}
      <div class="grid2"><div class="field"><label for="f-circ">Circuito</label><select id="f-circ"><option value="">— sin asignar —</option>${circuitos().map(x => `<option value="${esc(x.pos)}"${x.pos === d.circuito ? ' selected' : ''}>${esc(x.pos)} · ${esc((x.desc || '').slice(0, 34))}</option>`).join('')}</select></div>
      <div class="field"><label for="f-est">Estancia</label><input id="f-est" value="${esc(d.estancia)}" list="dl-est"><datalist id="dl-est">${rooms.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div></div>
      <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" placeholder="Luz, enchufe, qué aparato…">${esc(d.notas)}</textarea></div>
      ${actions(id, id ? '<button class="btn" id="move">Mover en el plano</button>' : '')}`);
    wireDel('puntos', id);
    const collect = () => ({ planta: d.planta, x: +d.x, y: +d.y, circuito: $('#f-circ').value, estancia: $('#f-est').value.trim(), notas: $('#f-notas').value.trim() });
    const mv = $('#move'); if (mv) mv.onclick = () => { const cur = collect(); placing = { kind: 'punto', id, data: cur }; view = 'plano'; planta = d.planta; closeSheet(); };
    $('#cancel').onclick = $('#scrim').onclick = () => { selId = null; closeSheet(); };
    $('#save').onclick = () => { const data = collect(); if (!data.estancia) return msg('Indica la estancia.'); selId = null; write('puntos', id, data); };
  }
  function estancias() { return [...new Set(puntos().map(p => p.estancia).concat(casa.elementos.map(e => e.estancia)).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es')); }

  function openBox(code) {
    const k = caja(code); if (!k) return;
    const cs = condsOf(code); const s = boxState(code);
    sheet(`<h2>Registro ${esc(k.codigo)}</h2>
      <p class="hint" style="margin:0">${esc(plantaNombre(k.planta))}${k.ubicacion ? ' · ' + esc(k.ubicacion) : ''}${placed(k) ? '' : ' · <b>sin ubicar en el plano</b>'}</p>
      ${k.aviso ? `<div class="aviso">⚠ ${esc(k.aviso)}</div>` : ''}
      ${k.notas ? `<p style="margin:0;font-size:.9rem">${esc(k.notas)}</p>` : ''}
      ${(k.fotos || []).length ? `<div class="fotos" id="fotos"></div>` : ''}
      <p class="hint" style="margin:0">${cs.length} conductores anotados${s.unk ? ` · <b style="color:var(--unk)">${s.unk} sin identificar</b>` : ''}${s.dud ? ` · <b style="color:var(--dud)">${s.dud} dudosos</b>` : ''}</p>
      <div>${cs.map(n => condHTML(n) + (n.enlace && caja(n.enlace) ? `<div style="margin:-4px 0 6px"><button class="linkto" data-go="${esc(n.enlace)}">→ ir a ${esc(n.enlace)}${caja(n.enlace).planta !== k.planta ? ' (' + esc(plantaNombre(caja(n.enlace).planta).toLowerCase()) + ')' : ''}</button></div>` : '')).join('') || '<p class="status">Sin conductores anotados.</p>'}</div>
      ${conds().filter(n => n.enlace === code && n.caja !== code).length ? `<h3>Llegan desde</h3><div>${conds().filter(n => n.enlace === code && n.caja !== code).map(n => `<div><button class="linkto" data-go="${esc(n.caja)}">← ${esc(n.caja)}</button> <span class="hint">${esc(n.funcion || '')}</span></div>`).join('')}</div>` : ''}
      <div class="actions"><div><button class="btn" id="addn">+ Conductor</button><button class="btn" id="editk">Editar registro</button><button class="btn" id="movek">${placed(k) ? 'Mover' : 'Colocar'} en el plano</button></div><div><button class="btn" id="cancel">Cerrar</button></div></div>`);
    if ((k.fotos || []).length) fotosWidget($('#fotos'), k.fotos.slice(), null);
    $('#cancel').onclick = $('#scrim').onclick = () => { selId = null; closeSheet(); };
    $('#addn').onclick = () => openCond({ caja: code, estado: 'desconocido', orden: cs.length + 1 });
    $('#editk').onclick = () => openCaja({ ...k }, k.id);
    $('#movek').onclick = () => { placing = { kind: 'caja', id: k.id, code: k.codigo }; view = 'plano'; ls('hm.view', view); if (k.planta && plantaDe(k.planta)) { planta = k.planta; ls('hm.planta', planta); } capas.add('registros'); saveCapas(); closeSheet(); };
    document.querySelectorAll('.sheet .cond').forEach(b => b.onclick = () => { const n = conds().find(x => x.id === b.dataset.c); openCond({ ...n }, n.id); });
    document.querySelectorAll('.sheet [data-go]').forEach(b => b.onclick = () => { const t = caja(b.dataset.go); $('#editor').hidden = true; $('#editor').innerHTML = ''; capas.add('registros'); saveCapas(); go('plano', { planta: t.planta, sel: t.codigo }); openBox(t.codigo); });
  }

  function openCaja(d, id) {
    const fotos = (d.fotos || []).slice();
    sheet(`<h2>${id ? 'Editar registro ' + esc(d.codigo) : 'Nuevo registro'}</h2>
      <div class="grid2"><div class="field"><label for="f-cod">Código</label><input id="f-cod" value="${esc(d.codigo)}" placeholder="p. ej. HS-C6"></div>
      <div class="field"><label for="f-pl">Planta</label><select id="f-pl">${plantas().map(p => `<option value="${esc(p.id)}"${p.id === d.planta ? ' selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div></div>
      <div class="field"><label for="f-ub">Ubicación</label><input id="f-ub" value="${esc(d.ubicacion)}" placeholder="Encima de la puerta del ropero…"></div>
      <div class="field"><label for="f-av">Aviso de seguridad</label><input id="f-av" value="${esc(d.aviso)}" placeholder="p. ej. sin tierra"></div>
      <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas">${esc(d.notas)}</textarea></div>
      <div class="field"><label>Fotos</label><div class="fotos" id="fotos"></div></div>
      ${actions(id)}`);
    fotosWidget($('#fotos'), fotos, 'registro');
    const back = () => { if (id) { $('#editor').hidden = true; $('#editor').innerHTML = ''; render(); openBox(d.codigo); } else closeSheet(); };
    wireDel('cajas', id);
    $('#cancel').onclick = $('#scrim').onclick = back;
    $('#save').onclick = () => {
      const codigo = $('#f-cod').value.trim().toUpperCase(); if (!codigo) return msg('Indica el código del registro.');
      if (cajas().some(k => k.codigo === codigo && k.id !== id)) return msg('Ya existe un registro con ese código.');
      const data = { codigo, planta: $('#f-pl').value, ubicacion: $('#f-ub').value.trim(), aviso: $('#f-av').value.trim(), notas: $('#f-notas').value.trim(), fotos, x: placed(d) ? +d.x : null, y: placed(d) ? +d.y : null };
      if (data.planta !== d.planta && id) { data.x = null; data.y = null; }
      const did = id || ('k-' + codigo.replace(/[^A-Za-z0-9_-]/g, '_'));
      // cambiar el código arrastra los conductores que cuelgan de él y los enlaces que apuntan a él
      if (id && d.codigo && d.codigo !== codigo) conds().forEach(n => { if (n.caja === d.codigo) n.caja = codigo; if (n.enlace === d.codigo) n.enlace = codigo; });
      write('cajas', did, data, () => {
        if (!id || !placed(data)) { placing = { kind: 'caja', id: did, code: codigo }; view = 'plano'; planta = data.planta; ls('hm.view', view); ls('hm.planta', planta); capas.add('registros'); saveCapas(); closeSheet(); }
        else { d.codigo = codigo; back(); }
      });
    };
  }

  function openCond(d, id) {
    sheet(`<h2>${id ? 'Conductor' : 'Nuevo conductor'} · ${esc(d.caja)}</h2>
      <div class="field"><label for="f-fun">Qué es / adónde va</label><input id="f-fun" value="${esc(d.funcion)}"></div>
      <div class="field"><label for="f-rec">Recorrido (tomas)</label><input id="f-rec" value="${esc(d.recorrido)}" placeholder="HS-C4-L2 → HS-C4-R2 → HS-C5-L2"></div>
      <div class="grid2"><div class="field"><label for="f-est">Estado</label><select id="f-est">${ESTADOS.map(e => `<option value="${e}"${e === d.estado ? ' selected' : ''}>${e === 'desconocido' ? 'sin identificar' : e}</option>`).join('')}</select></div>
      <div class="field"><label for="f-ty">Tipo</label><select id="f-ty"><option value="">—</option>${opts(CTIPOS, d.tipo)}</select></div></div>
      <div class="grid2"><div class="field"><label for="f-enl">Conecta con registro</label><select id="f-enl"><option value="">—</option>${cajas().map(k => k.codigo).sort().filter(c => c !== d.caja).map(c => `<option${c === d.enlace ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-ci">Automático</label><select id="f-ci"><option value="">—</option>${circuitos().map(c => `<option value="${esc(c.pos)}"${c.pos === d.circuito ? ' selected' : ''}>${esc(c.pos)}</option>`).join('')}</select></div></div>
      <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas">${esc(d.notas)}</textarea></div>
      ${actions(id)}`);
    const back = () => { const code = d.caja; $('#editor').hidden = true; $('#editor').innerHTML = ''; render(); openBox(code); };
    wireDel('conductores', id, back);
    $('#cancel').onclick = $('#scrim').onclick = back;
    $('#save').onclick = () => write('conductores', id, { caja: d.caja, orden: +d.orden || 0, funcion: $('#f-fun').value.trim(), recorrido: $('#f-rec').value.trim(), estado: $('#f-est').value, tipo: $('#f-ty').value, enlace: $('#f-enl').value, circuito: $('#f-ci').value, notas: $('#f-notas').value.trim() }, back);
  }

  /* ---------- elementos de los demás sistemas ---------- */
  function openEl(d, id) {
    const fotos = (d.fotos || []).slice();
    const rooms = estancias();
    const tr = id ? tramosDe(id) : [];
    const hs = id ? casa.historial.filter(h => h.elemento === id).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))) : [];
    const prox = proxima(d);
    sheet(`<h2>${id ? esc(icono(d) + ' ' + nombreEl(d)) : 'Nuevo elemento'}${d.planta ? ' · ' + esc(plantaNombre(d.planta)) : ''}</h2>
      <div class="grid2"><div class="field"><label for="f-sis">Sistema</label><select id="f-sis">${SIS_KEYS.map(k => `<option value="${k}"${k === d.sistema ? ' selected' : ''}>${esc(SISTEMAS[k].icono + ' ' + SISTEMAS[k].nombre)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-tipo">Tipo</label><select id="f-tipo"></select></div></div>
      <div class="grid2"><div class="field"><label for="f-nom">Nombre o etiqueta</label><input id="f-nom" value="${esc(d.nombre)}" placeholder="Radiador ventana, Llave general…"></div>
      <div class="field"><label for="f-est">Estancia</label><input id="f-est" value="${esc(d.estancia)}" list="dl-est"><datalist id="dl-est">${rooms.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div></div>
      <div class="grid2"><div class="field"><label for="f-pl">Planta</label><select id="f-pl"><option value="">— sin planta —</option>${plantas().map(p => `<option value="${esc(p.id)}"${p.id === d.planta ? ' selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-es">Estado</label><select id="f-es">${Object.entries(ESTADOS_EL).map(([k, l]) => `<option value="${k}"${k === (d.estado || 'ok') ? ' selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <div class="grid2"><div class="field"><label for="f-mar">Marca / modelo</label><input id="f-mar" value="${esc(d.marca)}"></div>
      <div class="field"><label for="f-ins">Instalado</label><input id="f-ins" type="date" value="${esc(d.instalado)}"></div></div>
      <div class="grid2"><div class="field"><label for="f-rm">Revisar cada (meses)</label><input id="f-rm" type="number" min="0" inputmode="numeric" value="${esc(d.revisionMeses)}"></div>
      <div class="field"><label for="f-ur">Última revisión</label><input id="f-ur" type="date" value="${esc(d.ultimaRevision)}"></div></div>
      ${prox ? `<p class="hint" style="margin:0">Próxima revisión: <b style="color:var(--fg)">${esc(fmt(prox))}</b></p>` : ''}
      <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" placeholder="Presión, contraseñas no; qué llave corta qué, teléfono del técnico…">${esc(d.notas)}</textarea></div>
      <div class="field"><label>Fotos</label><div class="fotos" id="fotos"></div></div>
      ${id ? `<h3>Conexiones</h3><div>${tr.map(t => { const o = elem(t.desde === id ? t.hasta : t.desde); if (!o) return ''; return `<div class="cond" style="cursor:default"><span class="top"><span class="ty">${esc(t.tipo || '')}</span><button class="linkto" data-goe="${esc(o.id)}">${t.desde === id ? '→' : '←'} ${esc(icono(o) + ' ' + nombreEl(o))}${o.planta !== d.planta ? ' (' + esc(plantaNombre(o.planta).toLowerCase()) + ')' : ''}</button><button class="edit" data-tr="${esc(t.id)}">Editar</button></span>${t.notas ? `<span class="route">${esc(t.notas)}</span>` : ''}</div>`; }).join('') || '<p class="hint" style="margin:0">Sin conexiones. Une por ejemplo la caldera con el colector, o la llave de paso con lo que corta.</p>'}</div>
      <h3>Historial</h3><div>${hs.map(logHTML).join('') || '<p class="hint" style="margin:0">Sin anotaciones.</p>'}</div>` : ''}
      ${actions(id, id ? `<button class="btn" id="addt">+ Conexión</button><button class="btn" id="addh">+ Anotación</button><button class="btn" id="move">${placed(d) ? 'Mover' : 'Colocar'} en el plano</button>` : '')}`);
    const fillTipos = () => { const s = sis($('#f-sis').value); const ts = Object.keys(s.tipos); $('#f-tipo').innerHTML = ts.map(t => `<option${t === d.tipo ? ' selected' : ''}>${esc(t)}</option>`).join(''); };
    fillTipos(); $('#f-sis').onchange = fillTipos;
    fotosWidget($('#fotos'), fotos, 'elemento');
    wireDel('elementos', id);
    const collect = () => ({
      sistema: $('#f-sis').value, tipo: $('#f-tipo').value, nombre: $('#f-nom').value.trim(), estancia: $('#f-est').value.trim(), planta: $('#f-pl').value,
      estado: $('#f-es').value, marca: $('#f-mar').value.trim(), instalado: $('#f-ins').value, revisionMeses: $('#f-rm').value ? +$('#f-rm').value : '',
      ultimaRevision: $('#f-ur').value, notas: $('#f-notas').value.trim(), fotos,
      x: placed(d) && $('#f-pl').value === d.planta ? +d.x : null, y: placed(d) && $('#f-pl').value === d.planta ? +d.y : null
    });
    const guarda = after => { const data = collect(); ls('hm.sistema', data.sistema); capas.add(data.sistema); saveCapas(); write('elementos', id, data, after); return data; };
    $('#cancel').onclick = $('#scrim').onclick = () => { selId = null; closeSheet(); };
    $('#save').onclick = () => { selId = null; guarda(); };
    if (id) {
      $('#move').onclick = () => { const data = guarda(() => { }); if (!data.planta) return msg('Elige primero la planta.'); placing = { kind: 'el', id }; view = 'plano'; planta = data.planta; ls('hm.view', view); ls('hm.planta', planta); closeSheet(); };
      $('#addt').onclick = () => { guarda(() => { }); openTramo({ desde: id, sistema: $('#f-sis').value }); };
      $('#addh').onclick = () => { guarda(() => { }); openNota({ fecha: hoy(), sistema: $('#f-sis').value, elemento: id }, null, () => reopenEl(id)); };
      document.querySelectorAll('.sheet [data-goe]').forEach(b => b.onclick = () => { guarda(() => { }); const o = elem(b.dataset.goe); $('#editor').hidden = true; $('#editor').innerHTML = ''; if (placed(o) && o.planta) { capas.add(o.sistema); saveCapas(); go('plano', { planta: o.planta, sel: o.id }); } else render(); reopenEl(o.id); });
      document.querySelectorAll('.sheet [data-tr]').forEach(b => b.onclick = () => { guarda(() => { }); const t = casa.tramos.find(x => x.id === b.dataset.tr); openTramo({ ...t }, t.id); });
      document.querySelectorAll('.sheet [data-h]').forEach(b => b.onclick = () => { guarda(() => { }); const h = casa.historial.find(x => x.id === b.dataset.h); openNota({ ...h }, h.id, () => reopenEl(id)); });
    } else if (d.x === null || d.x === undefined) {
      // alta desde la lista: al guardar, se ofrece colocarlo en el plano directamente
      $('#save').onclick = () => { const data = collect(); guarda(nid => { if (data.planta && plantaDe(data.planta)) { placing = { kind: 'el', id: nid }; view = 'plano'; planta = data.planta; ls('hm.view', view); } closeSheet(); }); };
    }
  }
  function reopenEl(id) { const e = elem(id); $('#editor').hidden = true; $('#editor').innerHTML = ''; render(); if (e) openEl({ ...e }, id); }

  function openTramo(d, id) {
    const from = elem(d.desde);
    const s = d.sistema || (from && from.sistema) || 'otros';
    const cand = casa.elementos.filter(e => e.id !== d.desde).sort((a, b) => (a.sistema === s ? 0 : 1) - (b.sistema === s ? 0 : 1) || plantaNombre(a.planta).localeCompare(plantaNombre(b.planta), 'es') || nombreEl(a).localeCompare(nombreEl(b), 'es'));
    sheet(`<h2>${id ? 'Conexión' : 'Nueva conexión'} desde ${esc(from ? icono(from) + ' ' + nombreEl(from) : '?')}</h2>
      <div class="field"><label for="f-ha">Hasta</label><select id="f-ha"><option value="">— elige —</option>${cand.map(e => `<option value="${esc(e.id)}"${e.id === d.hasta ? ' selected' : ''}>${esc(icono(e) + ' ' + nombreEl(e) + ' · ' + plantaNombre(e.planta) + (e.estancia ? ' · ' + e.estancia : ''))}</option>`).join('')}</select></div>
      <div class="field"><label for="f-tt">Tipo</label><select id="f-tt">${opts(sis(s).tramos, d.tipo)}</select></div>
      <div class="field"><label for="f-notas">Notas</label><textarea id="f-notas" placeholder="Por dónde va, diámetro, material…">${esc(d.notas)}</textarea></div>
      ${actions(id)}`);
    const back = () => reopenEl(d.desde);
    wireDel('tramos', id, back);
    $('#cancel').onclick = $('#scrim').onclick = back;
    $('#save').onclick = () => { const h = $('#f-ha').value; if (!h) return msg('Elige el otro extremo de la conexión.'); write('tramos', id, { desde: d.desde, hasta: h, sistema: s, tipo: $('#f-tt').value, notas: $('#f-notas').value.trim() }, back); };
  }

  function openNota(d, id, after) {
    const sysOpts = [...SIS_KEYS.map(k => [k, SISTEMAS[k].corto]), ['cuadro', 'Cuadro eléctrico'], ['general', 'General']];
    const fillEls = () => { const s = $('#f-sis').value; const els = casa.elementos.filter(e => e.sistema === s); $('#f-el').innerHTML = `<option value="">— ninguno —</option>` + els.map(e => `<option value="${esc(e.id)}"${e.id === d.elemento ? ' selected' : ''}>${esc(icono(e) + ' ' + nombreEl(e) + ' · ' + plantaNombre(e.planta))}</option>`).join(''); $('#f-el').disabled = !els.length; };
    sheet(`<h2>${id ? 'Anotación' : 'Nueva anotación'}</h2>
      <div class="grid2"><div class="field"><label for="f-fe">Fecha</label><input id="f-fe" type="date" value="${esc(d.fecha)}"></div>
      <div class="field"><label for="f-sis">Sistema</label><select id="f-sis">${sysOpts.map(([k, l]) => `<option value="${k}"${k === d.sistema ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div></div>
      <div class="field"><label for="f-el">Elemento</label><select id="f-el"></select></div>
      <div class="field"><label for="f-tx">Qué se hizo / qué pasó</label><textarea id="f-tx" placeholder="Revisión anual de la caldera, cambio de purgador, fuga en…">${esc(d.texto)}</textarea></div>
      <div class="grid2"><div class="field"><label for="f-qu">Quién</label><input id="f-qu" value="${esc(d.quien)}" list="dl-qu"><datalist id="dl-qu">${[...new Set(casa.historial.map(h => h.quien).filter(Boolean))].map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
      <div class="field"><label for="f-co">Coste (€)</label><input id="f-co" inputmode="decimal" value="${esc(d.coste)}"></div></div>
      <label class="check"><input type="checkbox" id="f-rv"${d.revision ? ' checked' : ''}> Cuenta como revisión del elemento (actualiza su «última revisión»)</label>
      ${actions(id)}`);
    fillEls(); $('#f-sis').onchange = fillEls;
    const back = after || closeSheet;
    wireDel('historial', id, back);
    $('#cancel').onclick = $('#scrim').onclick = back;
    $('#save').onclick = () => {
      const data = { fecha: $('#f-fe').value || hoy(), sistema: $('#f-sis').value, elemento: $('#f-el').value, texto: $('#f-tx').value.trim(), quien: $('#f-qu').value.trim(), coste: $('#f-co').value.trim(), revision: $('#f-rv').checked };
      if (!data.texto) return msg('Escribe qué se hizo.');
      if (data.revision && data.elemento) { const e = elem(data.elemento); if (e && (!e.ultimaRevision || e.ultimaRevision < data.fecha)) { e.ultimaRevision = data.fecha; if (e.estado === 'revisar') e.estado = 'ok'; } }
      write('historial', id, data, back);
    };
  }

  /* ---------- fotos ---------- */
  async function fotoUrl(name) {
    if (fotoUrls[name]) return fotoUrls[name];
    return fotoUrls[name] = URL.createObjectURL(await leeArchivo(name));
  }
  function fotosWidget(box, list, prefijo) {
    const draw = () => {
      box.innerHTML = list.map((f, i) => `<span class="foto" data-i="${i}" role="button" tabindex="0" aria-label="Ver foto"><img alt="">${prefijo ? `<button class="rm" data-rm="${i}" aria-label="Quitar foto">✕</button>` : ''}</span>`).join('') +
        (prefijo ? `<label class="addfoto">+ Foto<input type="file" accept="image/*" multiple></label>` : '');
      box.querySelectorAll('.foto').forEach(s => { const n = list[+s.dataset.i]; fotoUrl(n).then(u => { const im = s.querySelector('img'); if (im) im.src = u; }).catch(() => { s.title = 'No se encuentra ' + n; }); s.onclick = ev => { if (ev.target.closest('.rm')) return; lightbox(n); }; });
      box.querySelectorAll('[data-rm]').forEach(b => b.onclick = ev => { ev.stopPropagation(); list.splice(+b.dataset.rm, 1); draw(); });
      const inp = box.querySelector('input[type=file]');
      if (inp) inp.onchange = async () => {
        for (const f of inp.files) {
          try { box.querySelector('.addfoto').firstChild.textContent = 'Guardando…'; list.push(await guardaFoto(f, prefijo)); }
          catch (e) { msg('No se pudo guardar la foto: ' + esc(e.message)); }
        }
        draw();
      };
    };
    draw();
  }
  async function guardaFoto(file, prefijo) {
    // Reducir antes de guardar: una foto de móvil pesa 4–8 MB y en una carpeta de Drive se nota mucho.
    let blob = file;
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85)) || file;
    } catch (e) { }
    const name = `fotos/${prefijo}-${uid()}.jpg`;
    await escribe(name, blob);
    return name;
  }
  function lightbox(name) {
    const lb = $('#lightbox'); lb.innerHTML = `<div class="lb"><img alt=""><button class="btn">Cerrar</button></div>`; lb.hidden = false; marca();
    fotoUrl(name).then(u => lb.querySelector('img').src = u);
    lb.onclick = () => { lb.hidden = true; lb.innerHTML = ''; };
  }

  /* ---------- carpeta (File System Access API) ---------- */
  function idb() {
    return new Promise((res, rej) => { const r = indexedDB.open('homemanager-fs', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  async function rememberRoot(h) { try { const d = await idb(); d.transaction('h', 'readwrite').objectStore('h').put(h, 'root'); } catch (e) { } }
  async function recallRoot() { try { const d = await idb(); return await new Promise(r => { const q = d.transaction('h').objectStore('h').get('root'); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); } catch (e) { return null; } }
  async function permiso(h, pedir) { const mode = 'readwrite'; if (await h.queryPermission({ mode }) === 'granted') return true; return pedir && (await h.requestPermission({ mode })) === 'granted'; }

  async function dirDe(path, crear) { const parts = path.split('/'); let d = root; for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, { create: !!crear }); return [d, parts[parts.length - 1]]; }
  async function leeArchivo(path) { const [d, n] = await dirDe(path); return (await d.getFileHandle(n)).getFile(); }
  async function escribe(path, data) { const [d, n] = await dirDe(path, true); const fh = await d.getFileHandle(n, { create: true }); const w = await fh.createWritable(); await w.write(data); await w.close(); }

  async function pickRoot() {
    if (pickerBusy) return; pickerBusy = true;
    try {
      const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'homemanager', startIn: 'documents' });
      root = h; await rememberRoot(h); await cargaCasa();
    } catch (e) { if (e.name !== 'AbortError') setStatus('No se pudo abrir la carpeta: ' + e.message, true); }
    finally { pickerBusy = false; }
  }

  function normaliza(c) {
    c = c && typeof c === 'object' ? c : {};
    c.schemaVersion = c.schemaVersion || 1;
    c.casa = c.casa || { nombre: 'Mi casa' };
    c.plantas = Array.isArray(c.plantas) ? c.plantas : [];
    c.electrico = c.electrico || {};
    ELEC.forEach(k => { if (!Array.isArray(c.electrico[k])) c.electrico[k] = []; });
    ['elementos', 'tramos', 'historial'].forEach(k => { if (!Array.isArray(c[k])) c[k] = []; });
    return c;
  }

  async function cargaCasa(aviso) {
    setStatus('Leyendo la carpeta…'); setSync('Carpeta: ' + root.name);
    let f;
    try { f = await (await root.getFileHandle('casa.json')).getFile(); }
    catch (e) {
      if (e.name !== 'NotFoundError') { setStatus('No se pudo leer casa.json: ' + e.message, true); return; }
      casa = null; $('#tabs').hidden = true; setStatus('');
      const v = $('#view');
      v.innerHTML = `<div class="hero"><h2>La carpeta «${esc(root.name)}» no tiene casa.json</h2><p>Puedes empezar una casa nueva aquí (se crearán <code>casa.json</code>, <code>planos/</code> y <code>fotos/</code>), o elegir la carpeta donde ya la tienes.</p><div class="row-b"><button class="btn primary" id="nueva">Crear casa aquí</button><button class="btn" id="otra">Elegir otra carpeta</button></div></div>`;
      $('#nueva').onclick = async () => { casa = normaliza({ casa: { nombre: 'Mi casa' } }); await escribe('casa.json', JSON.stringify(casa, null, 1)); await cargaCasa(); go('ajustes'); };
      $('#otra').onclick = pickRoot;
      return;
    }
    try { casa = normaliza(JSON.parse(await f.text())); }
    catch (e) { setStatus('casa.json está dañado y no se puede leer (' + e.message + '). Recupera una copia de la carpeta «copias».', true); return; }
    lastMod = f.lastModified; backedUp = false;
    Object.keys(planUrls).forEach(k => { if (planUrls[k]) URL.revokeObjectURL(planUrls[k]); delete planUrls[k]; });
    setStatus(''); setSync('Carpeta: ' + root.name);
    if (aviso) flash('Datos releídos de la carpeta.');
    if (view !== 'cuadro') marca();
    render();
  }

  /* ---------- guardado ---------- */
  let saveTimer = null, saving = false, dirty = false, backedUp = false;
  const horaTxt = () => new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  function save() { dirty = true; setSync('Guardando…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); }
  async function flush() {
    if (saving) { saveTimer = setTimeout(flush, 300); return; }
    if (!dirty || !casa) return;
    saving = true; dirty = false;
    try {
      if (!(await permiso(root, false))) throw new Error('el navegador ha retirado el permiso de escritura; pulsa «Releer de la carpeta» en Ajustes');
      if (!backedUp) await copia();
      casa.actualizado = new Date().toISOString();
      await escribe('casa.json', JSON.stringify(casa, null, 1));
      lastMod = (await (await root.getFileHandle('casa.json')).getFile()).lastModified;
      setSync(`Guardado ${horaTxt()} · ${root.name}`);
    } catch (e) {
      dirty = true; setSync('Sin guardar', true);
      setStatus('No se pudo guardar casa.json: ' + e.message + '. Los cambios siguen en pantalla; vuelve a intentarlo.', true);
    } finally { saving = false; }
  }
  // Una copia por sesión antes de la primera escritura; se guardan las 20 más recientes.
  async function copia() {
    try {
      const txt = await (await root.getFileHandle('casa.json')).getFile().then(f => f.text());
      const st = new Date().toISOString().replace(/[-:]/g, '').replace('T', '-').slice(0, 13);
      await escribe(`copias/casa-${st}.json`, txt);
      const d = await root.getDirectoryHandle('copias');
      const names = []; for await (const [n] of d.entries()) if (/^casa-.*\.json$/.test(n)) names.push(n);
      names.sort(); for (const n of names.slice(0, Math.max(0, names.length - 20))) await d.removeEntry(n);
    } catch (e) { }
    backedUp = true;
  }
  window.addEventListener('beforeunload', ev => { if (dirty || saving) { flush(); ev.preventDefault(); ev.returnValue = ''; } });
  // Si otro dispositivo ha cambiado casa.json (carpeta sincronizada), se relee al volver a la app.
  async function compruebaExterno() {
    if (!root || !casa || dirty || saving || !$('#editor').hidden) return;
    try { const f = await (await root.getFileHandle('casa.json')).getFile(); if (f.lastModified > lastMod + 1500) await cargaCasa(true); } catch (e) { }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') compruebaExterno(); else if (dirty) flush(); });

  /* ---------- arranque ---------- */
  function bienvenida(h) {
    $('#tabs').hidden = true;
    $('#view').innerHTML = `<div class="hero"><h2>Infraestructura de casa</h2>
      <p>Cuadro eléctrico, calefacción, agua, desagües, gas, red… sobre los planos de tu casa. Los datos se guardan en una carpeta tuya (por ejemplo, dentro de Google Drive), nunca en esta app.</p>
      <div class="row-b">${h ? `<button class="btn primary" id="abrir">Abrir «${esc(h.name)}»</button><button class="btn" id="elegir">Elegir otra carpeta</button>` : `<button class="btn primary" id="elegir">📁 Elegir carpeta</button>`}</div></div>`;
    $('#elegir').onclick = pickRoot;
    if (h) $('#abrir').onclick = async () => { try { if (await permiso(h, true)) { root = h; await cargaCasa(); } else setStatus('Sin permiso no puedo leer la carpeta. Vuelve a pulsar y acepta.', true); } catch (e) { setStatus('No se pudo abrir la carpeta: ' + e.message, true); } };
  }
  async function arranque() {
    if (!('showDirectoryPicker' in window)) {
      $('#view').innerHTML = `<div class="hero"><h2>Este navegador no puede abrir carpetas</h2><p>La app guarda los datos en una carpeta tuya mediante la API de acceso a archivos, que tienen Chrome y Edge (escritorio y Android). Ábrela con uno de ellos.</p></div>`;
      return;
    }
    const h = await recallRoot();
    if (h) { try { if (await permiso(h, false)) { root = h; await cargaCasa(); return; } } catch (e) { } }
    bienvenida(h);
  }

  /* ---------- versión (la escribe sw.js) ---------- */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const pide = () => { const c = navigator.serviceWorker.controller; if (!c) return; const ch = new MessageChannel(); ch.port1.onmessage = e => { const b = $('#ver'); b.hidden = false; b.textContent = e.data; }; c.postMessage('version', [ch.port2]); };
      pide(); navigator.serviceWorker.addEventListener('controllerchange', pide);
      $('#ver').onclick = () => { if ($('#ver').classList.contains('new')) location.reload(); else reg.update().then(() => { if (reg.installing || reg.waiting) { $('#ver').classList.add('new'); $('#ver').textContent = 'Nueva versión · recargar'; } else flash('Ya tienes la última versión.'); }); };
    }).catch(() => { });
  }

  arranque();
})();
</script>
</body>
